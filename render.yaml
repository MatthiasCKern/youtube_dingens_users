services:
  - type: web
    name: youtube-analyse
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: youtube_web_app_postgres
          property: connectionString

databases:
  - name: youtube_web_app_postgres
    plan: free
    region: frankfurt

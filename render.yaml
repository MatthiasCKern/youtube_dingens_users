services:
  - type: web
    name: youtube-analyse
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: youtube_web_app_postgres
          property: connectionString
      - key: SECRET_KEY
        value: your-secret-key
